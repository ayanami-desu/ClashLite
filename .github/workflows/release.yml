name: Build DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1

      # 工程格式（objectVersion 110）需要 Xcode 27，macos-26 镜像最高只有 26.x
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 没有开发者证书，使用 ad-hoc 签名
      - name: Build
        run: |
          xcodebuild \
            -project ClashLite.xcodeproj \
            -scheme ClashLite \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=macOS" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      # alpha 是滚动预发布，资源名带提交短哈希
      - name: Download mihomo
        id: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="Prerelease-Alpha"
          mkdir -p build/mihomo && cd build/mihomo
          gh release download "$TAG" --repo MetaCubeX/mihomo \
            --pattern "mihomo-darwin-arm64-alpha-*.gz"
          ARCHIVE="$(ls mihomo-darwin-arm64-alpha-*.gz)"
          CORE="${ARCHIVE%.gz}"
          CORE_VERSION="${CORE#mihomo-darwin-arm64-}"
          gunzip -c "$ARCHIVE" > arm64
          chmod +x arm64
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

      # dmgbuild 直接写入 .DS_Store 来设置窗口样式，不依赖 Finder 脚本，在 CI 中更稳定
      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="build/DerivedData/Build/Products/Release/ClashLite.app"
          lipo "$APP/Contents/MacOS/ClashLite" -verify_arch arm64

          pipx install dmgbuild
          mkdir -p build/dmg
          swift dmg/background.swift build/dmg
          tiffutil -cathidpicheck build/dmg/background.png build/dmg/background@2x.png -out build/dmg/background.tiff

          make_dmg() {
            dmgbuild -s dmg/settings.py -D app="$1" -D background=build/dmg/background.tiff ClashLite "$2"
          }

          # 只打包 Apple 芯片 + 内置 alpha 内核；首次启动时复制到内核目录，改动了包内容，需重新签名
          BUNDLED="$(mktemp -d)/ClashLite.app"
          cp -R "$APP" "$BUNDLED"
          cp "build/mihomo/arm64" "$BUNDLED/Contents/Resources/mihomo"
          codesign --force --sign - "$BUNDLED/Contents/Resources/mihomo"
          codesign --force --sign - --options runtime --preserve-metadata=entitlements "$BUNDLED"
          codesign --verify --strict --verbose=2 "$BUNDLED"
          make_dmg "$BUNDLED" "ClashLite-$VERSION-mihomo-${{ steps.mihomo.outputs.version }}-arm64.dmg"

      - uses: actions/upload-artifact@v7.0.2
        with:
          path: "*.dmg"
          archive: false

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: "*.dmg"
          body: |
            ## 下载

            **内置 mihomo ${{ steps.mihomo.outputs.version }}，仅支持 Apple 芯片（M 系列）**

            - [ClashLite-${{ steps.version.outputs.version }}-mihomo-${{ steps.mihomo.outputs.version }}-arm64.dmg](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/ClashLite-${{ steps.version.outputs.version }}-mihomo-${{ steps.mihomo.outputs.version }}-arm64.dmg)

            > 需要 macOS 15 或更高版本，仅支持 Apple 芯片。
          generate_release_notes: true
