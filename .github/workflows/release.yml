name: Release

# 手动运行：填写版本号则编译通过后提交版本号、打标签并发布；留空只做测试构建
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 0.3.0（留空只构建不发布）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          VERSION="${INPUT#v}"
          if [[ -z "$VERSION" ]]; then
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号格式不正确：$VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::只能在 main 分支上发布"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::标签 v$VERSION 已存在"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    outputs:
      mihomo: ${{ steps.mihomo.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      # 工程格式（objectVersion 110）需要 Xcode 27，macos-26 镜像最高只有 26.x
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      # 没有开发者证书，使用 ad-hoc 签名
      - name: Build
        run: |
          xcodebuild \
            -project ClashLite.xcodeproj \
            -scheme ClashLite \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=macOS" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      # alpha 是滚动预发布，资源名带提交短哈希
      - name: Download mihomo
        id: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="Prerelease-Alpha"
          mkdir -p build/mihomo && cd build/mihomo
          gh release download "$TAG" --repo MetaCubeX/mihomo \
            --pattern "mihomo-darwin-arm64-alpha-*.gz"
          ARCHIVE="$(ls mihomo-darwin-arm64-alpha-*.gz)"
          CORE="${ARCHIVE%.gz}"
          CORE_VERSION="${CORE#mihomo-darwin-arm64-}"
          gunzip -c "$ARCHIVE" > arm64
          chmod +x arm64
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

      # dmgbuild 直接写入 .DS_Store 来设置窗口样式，不依赖 Finder 脚本，在 CI 中更稳定
      - name: Create DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/ClashLite.app"
          lipo "$APP/Contents/MacOS/ClashLite" -verify_arch arm64

          pipx install dmgbuild
          mkdir -p build/dmg
          swift dmg/background.swift build/dmg
          tiffutil -cathidpicheck build/dmg/background.png build/dmg/background@2x.png -out build/dmg/background.tiff

          make_dmg() {
            dmgbuild -s dmg/settings.py -D app="$1" -D background=build/dmg/background.tiff ClashLite "$2"
          }

          # 只打包 Apple 芯片 + 内置 alpha 内核；首次启动时复制到内核目录，改动了包内容，需重新签名
          BUNDLED="$(mktemp -d)/ClashLite.app"
          cp -R "$APP" "$BUNDLED"
          cp "build/mihomo/arm64" "$BUNDLED/Contents/Resources/mihomo"
          codesign --force --sign - "$BUNDLED/Contents/Resources/mihomo"
          codesign --force --sign - --options runtime --preserve-metadata=entitlements "$BUNDLED"
          codesign --verify --strict --verbose=2 "$BUNDLED"
          make_dmg "$BUNDLED" "ClashLite-$VERSION-mihomo-${{ steps.mihomo.outputs.version }}-arm64.dmg"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClashLite-${{ needs.prepare.outputs.version }}
          path: "*.dmg"
          archive: false
          retention-days: 1

  # 编译通过后才提交版本号和打标签，避免失败时留下无效标签
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      # 构建的就是这个提交（版本号已通过参数覆盖），若期间 main 有新提交则推送失败，不会发布
      - name: Commit version and tag
        run: |
          sed -i "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/" ClashLite.xcodeproj/project.pbxproj
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): $TAG"
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ClashLite-${{ needs.prepare.outputs.version }}

      - name: Compose release body
        env:
          MIHOMO: ${{ needs.build.outputs.mihomo }}
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.TAG }}
        run: |
          cat > body.md <<EOF
          ## 下载

          **内置 mihomo $MIHOMO，下载即用（推荐）**

          - Apple 芯片（M 系列）：[ClashLite-$VERSION-mihomo-$MIHOMO-arm64.dmg]($BASE/ClashLite-$VERSION-mihomo-$MIHOMO-arm64.dmg)

          > 需要 macOS 15 或更高版本，仅支持 Apple 芯片。
          EOF

      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: "*.dmg"
          body_path: body.md
          generate_release_notes: true
